name: docs
on:
  push:
    branches: [main]
    paths: [docs/**, mkdocs.yml, CONTRIBUTING.md]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install mkdocs-material
      - run: cp CONTRIBUTING.md docs/contributing.md && mkdocs gh-deploy --force
